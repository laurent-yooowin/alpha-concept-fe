services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: csps-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - csps-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p ${DATABASE_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

  # Redis used by the API, scheduler and Prevention worker.
  redis:
    image: redis:7-alpine
    container_name: csps-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - csps-network
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: csps-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LOG_DIR: /app/logs
      PORT: ${PORT:-8089}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: 3306
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TLS: ${REDIS_TLS:-false}
      PREVENTION_OBSERVABILITY_TOKEN: ${PREVENTION_OBSERVABILITY_TOKEN:?PREVENTION_OBSERVABILITY_TOKEN is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      PREVENTION_ALERT_DELAY_SECONDS: ${PREVENTION_ALERT_DELAY_SECONDS:-900}
      PREVENTION_WORKER_HEARTBEAT_STALE_SECONDS: ${PREVENTION_WORKER_HEARTBEAT_STALE_SECONDS:-120}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_ACCESS_POINT: ${AWS_S3_ACCESS_POINT}
      HYPER_ADMIN_EMAIL: ${HYPER_ADMIN_EMAIL:-}
      HYPER_ADMIN_PASSWORD: ${HYPER_ADMIN_PASSWORD:-}
      HYPER_ADMIN_FIRSTNAME: ${HYPER_ADMIN_FIRSTNAME:-}
      HYPER_ADMIN_LASTNAME: ${HYPER_ADMIN_LASTNAME:-}      
    ports:
      - "127.0.0.1:${PORT}:8089"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - csps-network
    volumes:
      - backend_logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8089/api/healthcheck",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Independent NestJS worker runtime for Prevention queues.
  prevention-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: csps-prevention-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LOG_DIR: /app/logs
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: 3306
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TLS: ${REDIS_TLS:-false}
      PREVENTION_WORKER_HEARTBEAT_INTERVAL_MS: ${PREVENTION_WORKER_HEARTBEAT_INTERVAL_MS:-10000}
      PREVENTION_WORKER_HEARTBEAT_TTL_SECONDS: ${PREVENTION_WORKER_HEARTBEAT_TTL_SECONDS:-300}
      PREVENTION_WORKER_HEARTBEAT_STALE_SECONDS: ${PREVENTION_WORKER_HEARTBEAT_STALE_SECONDS:-120}
    command: node dist/workers/prevention.worker.js
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - csps-network
    volumes:
      - backend_logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "dist/scripts/check-prevention-worker-health.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # -----------------------
  # Frontend React / Vite
  # -----------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: csps-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "80:80"
      - "443:443"
    networks:
      - csps-network
    volumes:
      - certbot_challenge:/var/www/certbot
      - certs:/etc/letsencrypt
    depends_on:
      backend:
        condition: service_healthy

  # -----------------------
  # Certbot SSL
  # -----------------------
  certbot:
    image: certbot/certbot
    container_name: csps-certbot
    restart: unless-stopped
    depends_on:
      - frontend
    networks:
      - csps-network
    volumes:
      - certbot_challenge:/var/www/certbot
      - certs:/etc/letsencrypt
    entrypoint: >
      sh -c "
      if [ ! -d /etc/letsencrypt/live/reportbtp.com ]; then
        certbot certonly --webroot -w /var/www/certbot \
          --non-interactive --agree-tos --email toufik@yooowin.com \
          -d reportbtp.com -d www.reportbtp.com;
      fi &&
      while true; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done
      "

# -----------------------
# Networks
# -----------------------
networks:
  csps-network:
    driver: bridge

# -----------------------
# Volumes
# -----------------------
volumes:
  mysql_data:
  redis_data:
  certbot_challenge:
  certs:
  nginx_cache:
  nginx_logs:
  backend_logs:
