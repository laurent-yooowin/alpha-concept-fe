version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: csps-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DATABASE_NAME:-csps_db}
      MYSQL_USER: ${DATABASE_USER:-csps_user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-csps_password}
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - csps-dev-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis used by the API outbox publisher (the worker is introduced in P3)
  redis:
    image: redis:7-alpine
    container_name: csps-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_dev_data:/data
    networks:
      - csps-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API (Development Mode)
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: csps-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${PORT:-8089}
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: ${DATABASE_USER:-csps_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-csps_password}
      DATABASE_NAME: ${DATABASE_NAME:-csps_db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TLS: ${REDIS_TLS:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_ACCESS_POINT: ${AWS_S3_ACCESS_POINT}
    ports:
      - "${PORT:-8089}:8089"
    depends_on:
      - mysql
    networks:
      - csps-dev-network
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    command: npm run dev

  # Independent NestJS worker runtime. P4 will add the BullMQ consumers.
  prevention-worker-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: csps-prevention-worker-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: ${DATABASE_USER:-csps_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-csps_password}
      DATABASE_NAME: ${DATABASE_NAME:-csps_db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TLS: ${REDIS_TLS:-false}
    depends_on:
      - mysql
      - redis
    networks:
      - csps-dev-network
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    command: npm run dev:prevention-worker
    stop_grace_period: 30s

networks:
  csps-dev-network:
    driver: bridge

volumes:
  mysql_dev_data:
    driver: local
  redis_dev_data:
    driver: local
